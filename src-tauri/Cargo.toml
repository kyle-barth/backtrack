[package]
name = "backtrack"
version = "0.4.9"
description = "Open-source replay buffer, clip editor and Discord exporter for Windows"
edition = "2021"
license = "MIT"
repository = "https://github.com/kyle-barth/backtrack"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
wasapi = "0.27"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
clipboard-win = "5"
trash = "5"
open = "5"
dirs = "5"
# Native (OLE) file drag out of the window, e.g. an export into a Discord chat. By the Tauri team (CrabNebula).
drag = "2"
tauri-plugin-updater = "2"
# gpu.rs: notice a graphics driver reset (a Direct3D device of our own reports itself lost). The version Tauri uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi"] }

[dev-dependencies]
# The release check that the installer's updater signature verifies against the app's public key (update.rs),
# with the same crates the updater plugin uses.
minisign-verify = "0.3"
base64 = "0.22"
# The colour test draws on screen with a D3D11 swap chain, like a game (the same crate version Tauri uses).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[features]
# Always serve the frontend embedded from ../ui (there is no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
